<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

    <style>
        body {
            background-color: #afafaf;
        }

        .navbar-brand {
            font-size: 1.4rem;
        }

        footer {
            font-size: 0.9rem;
        }

        .alert-message {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- HEADER -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-list-check"></i> To-Do
            </a>

            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="text-white me-3">
                        Olá, <strong>{{ user.username }}</strong>
                    </span>

                    <form method="post" title='Sair' action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="btn btn-outline-light btn-sm" type="submit">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">
                        Login
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- CONTEÚDO -->
    <main class="flex-fill container mt-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER -->
    {% include 'partial/_footer.html' %}

    <!-- MENSAGENS -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <script>
        setTimeout(function() {
            const messages = document.querySelectorAll('.alert-message');
            messages.forEach(function(msg) {
                msg.style.opacity = '0';
                setTimeout(() => msg.remove(), 500);
            });
        }, 5000);
    </script>

</body>
</html>
