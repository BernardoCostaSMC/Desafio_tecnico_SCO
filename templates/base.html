<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="..." crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>To-Do List</title>
</head>
<body class="d-flex flex-column min-vh-100">
    {% if user.is_authenticated %}
        <p>Olá, {{ user.username }} | 
           <form method="post"  action="{% url 'logout' %}">
               {% csrf_token %}
               <button  class="btn btn-secondary" type="submit"><i class="fa-solid fa-arrow-right-from-bracket" style="color: rgb(255, 255, 255);"> </i></button>
           </form>
        </p>
    {% endif %}

    {% block content %}{% endblock %}
    {% include 'partial/_footer.html' %}
    {% if messages %}
    {% for message in messages %}
        <div class="alert-message {{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
    {% endif %}

    <script>
        setTimeout(function() {
            const messages = document.querySelectorAll('.alert-message');
            messages.forEach(function(msg) {
                msg.style.opacity = '0';
                setTimeout(() => msg.remove(), 500);
            });
        }, 5000); // 5000ms = 5 segundos
    </script>
</body>
</html>
