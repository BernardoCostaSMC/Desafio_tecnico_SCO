{% extends 'base.html' %}

{% block content %}
    <h2>Nova Tarefa</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-info" type="submit"><i class="fa-regular fa-circle-down" style="color: rgb(255, 255, 255);"></i>Salvar</button>
    </form>

    <a  class="btn btn-secondary" href="{% url 'task_list' %}"><i class="fa-solid fa-angles-left" style="color: rgb(255, 255, 255);"> </i>Voltar</a>
{% endblock %}
