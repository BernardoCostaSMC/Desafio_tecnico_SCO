{% extends 'base.html' %}

{% block content %}
<h2>Minhas Tarefas</h2>

<a class="btn btn-info" href="{% url 'task_create' %}"><i class="fa-solid fa-circle-plus" style="color: rgb(255, 255, 255);"></i></a>

<ul>
    {% for task in tasks %}
        <li class="card">
            <div class="card-body">
                <h5 class="card-title">{{ task.title }}</h5>
                <pclass="card-text"> {{ task.description }}</p>
                - {{ task.get_status_display }}
            
                <a class="btn btn-info"  style="width: 50px" href="{% url 'task_update' task.pk %}"><i class="fa-solid fa-file-pen" style="color: rgb(255, 255, 255);"> </i></a>
                <a class="btn btn-danger" style="width: 50px" href="{% url 'task_delete' task.pk %}"><i class="fa-solid fa-trash-can" style="color: rgb(255, 255, 255);"> </i></a>
            </div>
        </li>
    {% empty %}
        <li>Nenhuma tarefa cadastrada.</li> 
    {% endfor %}
</ul>

{% endblock %}
