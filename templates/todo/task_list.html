{% extends 'base.html' %}

{% block content %}

<div class="container-xl">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Minhas Tarefas</h2>

        <a class="btn btn-info"
        href="{% url 'task_create' %}">
            <i class="fa-solid fa-circle-plus"></i>
        </a>
    </div>

   <ul class="list-unstyled">
    {% for task in tasks %}
        <li class="card mb-3 shadow-sm">
            <div class="card-body">

                <h5 class="card-title">{{ task.title }}</h5>

                <p class="card-text" style="white-space: pre-line;">{{ task.description }}</p>

                <p class="text-muted mb-3">
                    {{ task.get_status_display }}
                </p>

                <div class="d-flex gap-2">
                    <a class="btn btn-info btn-sm"
                       href="{% url 'task_update' task.pk %}">
                        <i class="fa-solid fa-file-pen"></i>
                    </a>

                    <a class="btn btn-danger btn-sm"
                       href="{% url 'task_delete' task.pk %}">
                        <i class="fa-solid fa-trash-can"></i>
                    </a>
                </div>

            </div>
        </li>
    {% empty %}
        <li>Nenhuma tarefa cadastrada.</li>
    {% endfor %}
</ul>

</div>

{% endblock %}
