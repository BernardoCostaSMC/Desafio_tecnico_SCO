{% extends 'base.html' %}

{% block content %}
<h2>Confirmar exclusão</h2>

<p>Tem certeza que deseja excluir "{{ object.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <button class="btn btn-success" type="submit"><i class="fa-solid fa-circle-check" style="color: rgb(255, 255, 255);"></i>Confirmar</button>
</form>

<a href="{% url 'task_list' %}"  class="btn btn-secondary"><i class="fa-solid fa-circle-xmark" style="color: rgb(255, 255, 255);"></i>Cancelar</a>

{% endblock %}
