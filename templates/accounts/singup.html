{% extends 'base.html' %}

{% block content %}

<div style="width: 400px; margin: 60px auto; padding: 30px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">

    <h2 style="text-align: center; margin-bottom: 20px;">Criar Conta</h2>

    <form method="post">
        {% csrf_token %}

        <div style="margin-bottom: 15px;">
            <label for="id_username">Nome de usuário</label>
            {{ form.username }}
        </div>

        <div style="margin-bottom: 15px;">
            <label for="id_password1">Senha</label>
            {{ form.password1 }}
        </div>

        <div style="margin-bottom: 20px;">
            <label for="id_password2">Confirmar senha</label>
            {{ form.password2 }}
        </div>

        <button type="submit" 
                style="width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Cadastrar
        </button>
    </form>

    <p style="margin-top: 15px; text-align: center;">
        Já tem conta?
        <a href="{% url 'login' %}">Fazer login</a>
    </p>

</div>

{% if form.errors %}
    <div style="color: red;">
        {{ form.errors }}
    </div>
{% endif %}

{% endblock %}
